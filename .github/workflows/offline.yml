name: Offline standalone checks
on: [push, pull_request]
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TF_CPP_MIN_LOG_LEVEL: '3'
      TF_ENABLE_ONEDNN_OPTS: '0'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      MPLBACKEND: Agg
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-notebook.txt
      - run: python -c "import importlib.util; assert importlib.util.find_spec('torch') is None"
      - run: python -m unittest discover -s tests -v
      - run: python -m stellar_workflow smoke --offline --extended --run-dir outputs/ci-extended --n-boot 16
      - run: python scripts/execute_notebook.py
  transformer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r requirements-torch.txt --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -p test_transformer_optional.py -v
